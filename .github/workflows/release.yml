name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: make test
      - name: Build
        run: |
          ver=${GITHUB_REF_NAME#v}
          mkdir dist
          for arch in amd64 arm64; do
            name=opensnitch-zenity-$ver-linux-$arch
            mkdir -p "$name"
            GOARCH=$arch CGO_ENABLED=0 go build -trimpath -o "$name/opensnitch-zenity" ./cmd/opensnitch-zenity
            cp README.md LICENSE contrib/systemd/opensnitch-zenity.service "$name/"
            tar -czf "dist/$name.tar.gz" "$name"
          done
          cd dist && sha256sum *.tar.gz > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
