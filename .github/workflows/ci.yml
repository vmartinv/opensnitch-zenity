name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Lint
        run: make vet
      - name: Test
        run: make test
      - name: Cross-build
        run: |
          for arch in amd64 arm64; do
            GOARCH=$arch CGO_ENABLED=0 go build -o /dev/null ./cmd/opensnitch-zenity
          done
